[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sealman-core"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anyio==4.13.0",
    "fastapi==0.135.2",
    "httpx[http2]==0.28.1",
    "jsonschema==4.26.0",
    "python-dotenv==1.2.2",
    "PyYAML==6.0.3",
    "uvicorn==0.42.0",
    "PyJWT[crypto]==2.12.1",
    "python-multipart==0.0.22",
    "azure-storage-blob==12.28.0",
    "azure-data-tables==12.7.0",
    "aiofiles==25.1.0",
    "aiohttp==3.13.5",
    "azure-identity==1.25.3",
    "starlette==1.0.0",
    "psycopg[binary,pool]==3.3.3",
    "sqlalchemy[asyncio]==2.0.48",
    "alembic==1.18.4",
    "pydantic==2.12.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-mock==3.15.1",
    "coverage==7.13.5",
]

[tool.hatch.build.targets.wheel]
packages = ["sealman"]

[tool.hatch.build.targets.wheel.force-include]
"sealman/static" = "sealman/static"
"sealman/py.typed" = "sealman/py.typed"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-v --tb=short"
testpaths = [
    ".",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.uv]
dev-dependencies = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-mock==3.15.1",
    "coverage==7.13.5",
]
